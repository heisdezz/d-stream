name: Android Debug Build (Manual)

# Manually-triggered debug APK for on-device testing.
# Debug builds are signed with the standard auto-generated debug keystore
# (no release signing step) and are `debuggable`. NOTE: a debug APK expects a
# Metro dev server at launch — install it while `bunx expo start` is running on
# a reachable machine. Use the Release workflow for a standalone APK.
on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Target devices (ARM64 is fastest; universal supports all ABIs)'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - x86_64
          - arm64-v8a,x86_64
          - armeabi-v7a,arm64-v8a,x86,x86_64

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Android build
        uses: ./.github/actions/setup-android-build
        with:
          variant: debug
          architectures: ${{ env.ANDROID_ARCHITECTURES }}

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug \
            -PreactNativeArchitectures="$ANDROID_ARCHITECTURES" \
            --build-cache \
            --parallel \
            --max-workers=2 \
            --no-daemon \
            --stacktrace

      - name: 📦 Find and Rename Debug APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/d-stream-debug.apk
            echo "APK generated at build-output/d-stream-debug.apk"
          else
            echo "::error::No APK found in output directory"
            exit 1
          fi

      - name: 🚀 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d-stream-android-debug
          path: build-output/d-stream-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
