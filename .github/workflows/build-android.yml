name: Android Release Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Target devices (ARM64 is fastest; universal supports all ABIs)'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - arm64-v8a,x86_64
          - armeabi-v7a,arm64-v8a,x86,x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Prepare Android build
        uses: ./.github/actions/setup-android-build
        with:
          variant: release
          architectures: ${{ env.ANDROID_ARCHITECTURES }}

      - name: 🔑 Auto-Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$GITHUB_WORKSPACE/android/app/release.keystore" \
            -alias dstream \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dstreampass123 \
            -keypass dstreampass123 \
            -dname "CN=DStream, OU=Mobile, O=DStream, L=Unknown, ST=Unknown, C=US"

      - name: 🔨 Build Release APK
        run: |
          cd android
          ./gradlew :dstream-downloads:testReleaseUnitTest :app:assembleRelease \
            -PreactNativeArchitectures="$ANDROID_ARCHITECTURES" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password=dstreampass123 \
            -Pandroid.injected.signing.key.alias=dstream \
            -Pandroid.injected.signing.key.password=dstreampass123 \
            --build-cache \
            --parallel \
            --max-workers=2 \
            --no-daemon \
            --stacktrace

      - name: 📦 Find and Rename Release APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/d-stream-release.apk
            echo "APK generated at build-output/d-stream-release.apk"
          else
            echo "::error::No APK found in output directory"
            exit 1
          fi

      - name: 🚀 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d-stream-android-release
          path: build-output/d-stream-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 📝 Generate Structured Release Notes
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: bun .github/scripts/generate-release-notes.js

      - name: 🏷️ Determine Release Tag & Version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        id: release_meta
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG_NAME="v${VERSION}-b${{ github.run_number }}"
          RELEASE_TITLE="d-stream v${VERSION} (Build #${{ github.run_number }})"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: 🎉 Publish GitHub Release Package
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body_path: build-output/RELEASE_NOTES.md
          files: |
            build-output/d-stream-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
