name: Prepare Android build
description: Install SDK 57 tooling and restore dependency and native compiler caches

inputs:
  variant:
    description: Gradle build variant (debug or release)
    required: true
  architectures:
    description: Comma-separated Android ABIs
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        # v3's default included the removed "tools" package and failed setup.
        packages: platform-tools

    - name: Cache Bun package store
      uses: actions/cache@v4
      with:
        # Installing from Bun's local store is quick. Caching all node_modules
        # would also archive native outputs a second time after the build.
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-v2-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-v2-1.4.2-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Verify TypeScript and regressions
      shell: bash
      run: |
        bun run typecheck
        bun run test:downloads
        bun run test:discovery

    # Generate a complete Android project before restoring any native folders.
    - name: Expo prebuild
      shell: bash
      run: bunx expo prebuild --platform android --no-install

    - name: Configure Gradle caching and workers
      shell: bash
      run: |
        printf '\norg.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.workers.max=2\n' >> android/gradle.properties

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Cache native C++ outputs
      uses: actions/cache@v4
      with:
        path: |
          android/app/.cxx
          android/app/build/intermediates/cxx
          node_modules/*/android/.cxx
          node_modules/*/android/build/intermediates/cxx
          node_modules/@*/*/android/.cxx
          node_modules/@*/*/android/build/intermediates/cxx
          modules/*/android/.cxx
          modules/*/android/build/intermediates/cxx
        # GitHub caches are immutable. A SHA suffix lets each new build save
        # refreshed outputs, while restore prefixes reuse earlier compilations.
        key: ${{ runner.os }}-ubuntu24-sdk57-cxx-v2-${{ inputs.variant }}-${{ inputs.architectures }}-${{ hashFiles('bun.lock', 'app.json', 'package.json', 'modules/**', 'android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ubuntu24-sdk57-cxx-v2-${{ inputs.variant }}-${{ inputs.architectures }}-${{ hashFiles('bun.lock', 'app.json', 'package.json', 'modules/**', 'android/gradle/wrapper/gradle-wrapper.properties') }}-
          ${{ runner.os }}-ubuntu24-sdk57-cxx-v2-${{ inputs.variant }}-${{ inputs.architectures }}-

    # React Native's application CMake automatically uses ccache when present.
    - name: Setup C++ compiler cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-sdk57-${{ inputs.variant }}-${{ inputs.architectures }}
        max-size: 1G
        save: ${{ github.ref == 'refs/heads/main' }}
